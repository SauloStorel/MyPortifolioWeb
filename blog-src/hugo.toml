# Blog da Storell. O Hugo gera só /blog e /en/blog; o resto do site é HTML escrito à mão.
# Para gerar: ./blog-src/build.sh   (com -D inclui os rascunhos)
baseURL = "https://www.storell.dev.br/"
title = "Storell"
defaultContentLanguage = "pt"
defaultContentLanguageInSubdir = false
disableKinds = ["home", "robotsTXT", "404"]

[taxonomies]
  tag = "tags"

[permalinks.taxonomy]
  tags = "/blog/tags/"
[permalinks.term]
  tags = "/blog/tags/:slug/"

[languages.pt]
  locale = "pt-BR"
  label = "Português"
  contentDir = "content/pt"
  weight = 1
  [languages.pt.params]
    home = "/"
    ogLocale = "pt_BR"
    [languages.pt.params.anchor]
      services = "servicos"
      work = "projetos"
      process = "processo"
      about = "sobre"
      contact = "contato"

[languages.en]
  locale = "en"
  label = "English"
  contentDir = "content/en"
  weight = 2
  [languages.en.params]
    home = "/en/"
    ogLocale = "en_US"
    [languages.en.params.anchor]
      services = "services"
      work = "work"
      process = "process"
      about = "about"
      contact = "contact"

# "Leia também": artigos que dividem tags, inclusive os mais novos.
[related]
  includeNewer = true
  threshold = 0
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100

[markup.highlight]
  noClasses = true
  style = "github-dark"
  lineNos = false
