{{ define "main" }}
<section class="blog-head wrap">
  <p class="eyebrow"><a class="link" href="{{ (site.GetPage "/blog").RelPermalink }}">{{ i18n "back_to_blog" }}</a></p>
  <h1 class="blog-title">#{{ .Data.Term }}<span class="dot"></span></h1>
  <p class="blog-lead">{{ i18n "posts_tagged" }} “{{ .Data.Term }}”.</p>
</section>
<section class="blog-list wrap">
  {{ partial "article-list.html" .Pages }}
</section>
{{ end }}
